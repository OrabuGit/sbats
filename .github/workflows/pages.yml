# Builds /app and publishes it to GitHub Pages on every push to main.
# The site is served from https://orabugit.github.io/sbats/, so the Vite base is /sbats/.
# The base is passed on the command line; app/vite.config.ts keeps its relative base for local use.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        # The lockfile was written by npm 11.6.2. Newer npm refuses it ("Missing: @emnapi/core from
        # lock file", two packages only the wasm fallback builds need), so CI uses the same npm.
        run: |
          npm install -g npm@11.6.2
          npm ci
      - name: Typecheck and build
        working-directory: app
        run: npx tsc --noEmit && npx vite build --base=/sbats/
      - name: Fallback page and data check
        working-directory: app
        run: |
          # Unknown paths under /sbats/ get the app instead of the GitHub 404 page.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          for f in manifest.json earth.bin moon.bin mars.bin targets.json modules.json; do
            test -s "dist/data/$f" || { echo "missing dist/data/$f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
